# Save this as: /etc/nginx/sites-available/bee
# (replaces the current static-file config)

server {
    server_name bee.pscapps.com;

    client_max_body_size 20M;

    # Proxy all traffic to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5843;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve static assets directly (faster, bypasses Gunicorn)
    location /static/ {
        root /var/www/bee;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/bee.pscapps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bee.pscapps.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = bee.pscapps.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name bee.pscapps.com;
    return 404;
}
